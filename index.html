<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 NozzoLeague 2026</title>
<style>
:root{
  --bg:#050606;--panel:#101213;--panel2:#171a1c;--line:#34383a;
  --white:#f7f7f7;--muted:#a9adb0;--red:#ed1118;--green:#22b438;
  --yellow:#ffd21f;--grey:#aeb3b6;
}
*{box-sizing:border-box}
body{
  margin:0;color:var(--white);font-family:Inter,Segoe UI,Arial,sans-serif;
  background:
    linear-gradient(135deg,rgba(225,6,0,.06),transparent 22%),
    radial-gradient(circle at 80% 0,rgba(225,6,0,.08),transparent 30rem),
    var(--bg);
}
.app{max-width:1580px;margin:auto;padding:14px 18px 10px}
.header{
  display:grid;grid-template-columns:1fr 480px 72px;gap:18px;align-items:center;
  min-height:96px;border-bottom:1px solid rgba(237,17,24,.55);margin-bottom:14px;
}
.brand{display:flex;align-items:center}
.brand-lockup{display:flex;align-items:center;gap:20px;min-width:0}
.readable-brand{overflow:visible}
.f1-readable{
  color:#ed1118;
  font-family:Arial Black,Impact,Arial,sans-serif;
  font-size:68px;
  font-weight:1000;
  font-style:italic;
  line-height:1;
  letter-spacing:-5px;
  min-width:92px;
  text-align:left;
  text-shadow:0 0 10px rgba(237,17,24,.12)
}
.brand-copy{
  line-height:.9;
  font-style:italic;
  font-weight:1000;
  letter-spacing:-1.5px
}
.brand-copy .name{
  font-size:39px;
  white-space:nowrap;
  font-family:Arial Black,Impact,Arial,sans-serif;
  color:#fff
}
.brand-copy .name span{color:var(--red)}
.brand-copy .year{
  font-size:27px;
  margin-top:7px;
  letter-spacing:-.5px;
  font-family:Arial Black,Impact,Arial,sans-serif
}
.next{
  justify-self:end;width:100%;border:1px solid var(--line);border-radius:12px;
  background:linear-gradient(135deg,#111415,#090a0b);padding:12px 20px;
  display:flex;align-items:center;min-height:74px;
}
.next small{display:block;color:var(--red);font-weight:900}.next strong{font-size:28px;display:block}.next b{color:var(--red)}
.gear{
  width:64px;height:64px;border:1px solid var(--red);border-radius:12px;
  background:#0d0f10;color:white;font-size:30px;cursor:pointer
}
.main-grid{display:grid;grid-template-columns:1.22fr .85fr 1.04fr;gap:14px}
.panel{
  border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,#131617,#090b0c);
  overflow:hidden;box-shadow:0 16px 35px rgba(0,0,0,.22)
}
.panel-title{
  height:53px;display:flex;align-items:center;gap:12px;padding:0 18px;
  font-size:20px;font-weight:950;border-bottom:1px solid #222628
}
.panel-title .icon{color:var(--red);font-size:23px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 12px;border-bottom:1px solid #242729;text-align:left;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;background:#1a1d1f;color:#e8e8e8;position:sticky;top:0;z-index:1}
tbody tr:hover td{background:#151819}
.pos{width:48px;text-align:center;font-weight:900}
.points{text-align:right;color:var(--red);font-weight:950}
.team{
  display:inline-flex;align-items:center;gap:8px
}
.team-logo{vertical-align:middle}
.calendar .table-wrap{max-height:620px}
.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:9px;vertical-align:-1px}
.done{color:#f2f2f2}.done .dot{background:var(--green)}
.next-state{color:var(--yellow);font-weight:900}.next-state .dot{background:var(--yellow)}
.wait .dot{background:var(--grey)}
.last-race{grid-column:1/-1;margin-top:14px}
.last-head{display:flex;align-items:center;gap:24px}
.last-head .gp{color:var(--red)}
.results-grid{display:grid;grid-template-columns:1fr 1fr}
.results-grid table:first-child{border-right:1px solid #25292b}
.footer{text-align:center;color:#666;letter-spacing:2px;font-size:13px;padding:15px 0 2px}

/* Editor */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.84);z-index:20;padding:15px;align-items:center;justify-content:center}
.modal.open{display:flex}
.editor{width:min(1180px,100%);max-height:94vh;overflow:auto;background:#101213;border:1px solid var(--line);border-radius:15px;padding:18px}
.editor-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.editor h2{margin:0}.close,.save,.minor{border:0;border-radius:8px;padding:10px 14px;font-weight:900;cursor:pointer}
.close,.minor{background:#303436;color:#fff}.save{background:var(--red);color:#fff}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab{background:#282c2e;color:#fff;border:0;border-radius:8px;padding:10px 13px;font-weight:850;cursor:pointer}.tab.active{background:var(--red)}
.edit-panel{display:none}.edit-panel.active{display:block}
.edit-table{min-width:780px}.edit-table input,.edit-table select{
  width:100%;background:#1a1d1f;color:#fff;border:1px solid #3b4042;border-radius:7px;padding:8px
}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
@media(max-width:1100px){
  .header{grid-template-columns:1fr 330px 64px}
  .brand-copy .name{font-size:34px}.main-grid{grid-template-columns:1fr 1fr}.calendar{grid-column:1/-1}
}
@media(max-width:760px){
  .f1-readable{font-size:44px;letter-spacing:-3px;min-width:62px}
  .brand-copy .name{font-size:23px}
  .brand-copy .year{font-size:18px}
  .app{padding:10px}.header{grid-template-columns:1fr 56px}.next{grid-column:1/-1;grid-row:2}
  .brand-copy .name{font-size:23px}.brand-copy .year{font-size:18px}
  .main-grid{grid-template-columns:1fr}.calendar{grid-column:auto}.results-grid{grid-template-columns:1fr}
  .results-grid table:first-child{border-right:0}.panel-title{font-size:16px}
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <div class="brand-lockup readable-brand">
        <div class="f1-readable">F1</div>
        <div class="brand-copy">
          <div class="name">NOZZO<span>LEAGUE</span></div>
          <div class="year">2026</div>
        </div>
      </div>
    </div>

    <div class="next">
      <div>
        <small>PROSSIMO GP</small>
        <strong id="nextName">—</strong>
        <b id="nextRound">ROUND —</b>
      </div>
    </div>

    <button class="gear" onclick="openEditor()" title="Modifica">⚙</button>
  </header>

  <main>
    <section class="main-grid">
      <article class="panel">
        <div class="panel-title"><span class="icon">🏆</span> CLASSIFICA PILOTI</div>
        <div class="table-wrap"><table id="driversTable"></table></div>
      </article>

      <article class="panel">
        <div class="panel-title"><span class="icon">🏎</span> CLASSIFICA COSTRUTTORI</div>
        <div class="table-wrap"><table id="teamsTable"></table></div>
      </article>

      <article class="panel calendar">
        <div class="panel-title"><span class="icon">▦</span> CALENDARIO</div>
        <div class="table-wrap"><table id="calendarTable"></table></div>
      </article>
    </section>

    <section class="panel last-race">
      <div class="panel-title last-head"><span class="icon">🏁</span> ULTIMA GARA <span>|</span><span class="gp" id="lastGp">NESSUNA GARA</span></div>
      <div class="results-grid" id="resultsGrid"></div>
    </section>
  </main>

  <footer class="footer">F1 NOZZOLEAGUE 2026 — STAGIONE UFFICIALE<br><span id="lastUpdated" style="font-size:11px;letter-spacing:0;color:#8a8f92">Ultimo aggiornamento: —</span></footer>
</div>

<div class="modal" id="modal">
  <div class="editor">
    <div class="editor-head"><div><h2>Gestione NozzoLeague</h2><div class="note">Modifica i dati e premi Salva.</div></div><button class="close" onclick="closeEditor()">Chiudi</button></div>
    <div class="tabs">
      <button class="tab active" onclick="showTab('drivers',this)">Piloti</button>
      <button class="tab" onclick="showTab('calendar',this)">Calendario</button>
      <button class="tab" onclick="showTab('race',this)">Ultima gara</button>
    </div>
    <div class="edit-panel active" id="edit-drivers"><div class="table-wrap"><table class="edit-table" id="driversEdit"></table></div></div>
    <div class="edit-panel" id="edit-calendar"><div class="table-wrap"><table class="edit-table" id="calendarEdit"></table></div></div>
    <div class="edit-panel" id="edit-race">
      <div style="display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:10px">
        <input id="raceName" placeholder="Nome GP" style="background:#1a1d1f;color:#fff;border:1px solid #3b4042;border-radius:8px;padding:10px">
      </div>
      <div class="table-wrap"><table class="edit-table" id="raceEdit"></table></div>
      <button class="minor" onclick="addResult()">+ Aggiungi risultato</button>
    </div>
    <div class="actions">
      <button class="save" onclick="saveAll()">Salva</button>
      <button class="minor" onclick="exportHtml()">Esporta HTML</button>
      <button class="minor" onclick="exportBackup()">Esporta backup</button>
      <button class="minor" onclick="document.getElementById('backupInput').click()">Importa backup</button>
      <input id="backupInput" hidden type="file" accept=".json" onchange="importBackup(event)">
    </div>
  </div>
</div>

<script>
const teams = {
  "Mercedes":"#00a19c","Ferrari":"#e8002d","McLaren":"#ff8000","Red Bull Racing":"#3671c6",
  "Racing Bulls":"#6692ff","Alpine":"#ff87bc","Haas F1 Team":"#b6babd","Audi":"#c9002b",
  "Williams":"#64c4ff","Aston Martin":"#229971","Cadillac":"#d2d2d2"
};
const base={
 drivers:[
  ["George Russell","Mercedes",0],["Kimi Antonelli","Mercedes",0],["Charles Leclerc","Ferrari",0],["Lewis Hamilton","Ferrari",0],
  ["Lando Norris","McLaren",0],["Oscar Piastri","McLaren",0],["Max Verstappen","Red Bull Racing",0],["Isack Hadjar","Red Bull Racing",0],
  ["Liam Lawson","Racing Bulls",0],["Arvid Lindblad","Racing Bulls",0],["Pierre Gasly","Alpine",0],["Franco Colapinto","Alpine",0],
  ["Esteban Ocon","Haas F1 Team",0],["Oliver Bearman","Haas F1 Team",0],["Nico Hulkenberg","Audi",0],["Gabriel Bortoleto","Audi",0],
  ["Carlos Sainz","Williams",0],["Alexander Albon","Williams",0],["Fernando Alonso","Aston Martin",0],["Lance Stroll","Aston Martin",0],
  ["Sergio Perez","Cadillac",0],["Valtteri Bottas","Cadillac",0]
 ],
 calendar:[
  [1,"Australia","In attesa"],[2,"Cina","In attesa"],[3,"Giappone","In attesa"],[4,"Miami","In attesa"],
  [5,"Canada","In attesa"],[6,"Monaco","In attesa"],[7,"Barcellona-Catalogna","In attesa"],[8,"Austria","In attesa"],
  [9,"Gran Bretagna","In attesa"],[10,"Belgio","In attesa"],[11,"Ungheria","In attesa"],[12,"Paesi Bassi","In attesa"],
  [13,"Italia","In attesa"],[14,"Spagna","In attesa"],[15,"Azerbaijan","In attesa"],[16,"Singapore","In attesa"],
  [17,"Stati Uniti","In attesa"],[18,"Messico","In attesa"],[19,"Brasile","In attesa"],[20,"Las Vegas","In attesa"],
  [21,"Qatar","In attesa"],[22,"Abu Dhabi","In attesa"]
 ],
 race:{name:"Nessuna gara",results:[]},
 lastUpdated:""
};
let data=JSON.parse(localStorage.getItem("nozzoLeague2026")||JSON.stringify(base));
const logo=t=>`<span class="team-logo" style="display:inline-flex;align-items:center;justify-content:center;width:42px;height:22px;background:#222;border-left:4px solid ${(teams[t]||"#777")};border-radius:4px;font-size:9px;font-weight:900;color:#fff;margin-right:8px">${t.split(" ").map(x=>x[0]).join("").slice(0,3)}</span>`;
function render(){
 data.drivers.sort((a,b)=>Number(b[2])-Number(a[2])||a[0].localeCompare(b[0]));
 driversTable.innerHTML=`<thead><tr><th>Pos</th><th>Pilota</th><th>Scuderia</th><th style="text-align:right">Punti</th></tr></thead><tbody>`+
 data.drivers.map((d,i)=>`<tr><td class="pos">${i+1}</td><td><b>${d[0]}</b></td><td><span class="team">${logo(d[1])}${d[1]}</span></td><td class="points">${d[2]}</td></tr>`).join("")+"</tbody>";
 const sums={};data.drivers.forEach(d=>sums[d[1]]=(sums[d[1]]||0)+Number(d[2]||0));
 teamsTable.innerHTML=`<thead><tr><th>Pos</th><th>Scuderia</th><th style="text-align:right">Punti</th></tr></thead><tbody>`+
 Object.entries(sums).sort((a,b)=>b[1]-a[1]).map((t,i)=>`<tr><td class="pos">${i+1}</td><td>${logo(t[0])}<b>${t[0]}</b></td><td class="points">${t[1]}</td></tr>`).join("")+"</tbody>";
 calendarTable.innerHTML=`<thead><tr><th>Round</th><th>GP</th><th>Stato</th></tr></thead><tbody>`+
 data.calendar.map(c=>`<tr><td class="pos">${c[0]}</td><td><b>${c[1]}</b></td><td class="${c[2]==="Disputata"?"done":c[2]==="Prossima"?"next-state":"wait"}"><span class="dot"></span>${c[2]}</td></tr>`).join("")+"</tbody>";
 const next=data.calendar.find(c=>c[2]==="Prossima")||data.calendar.find(c=>c[2]==="In attesa");
 nextName.textContent=next?next[1].toUpperCase():"CONCLUSO";nextRound.textContent=next?`ROUND ${next[0]}`:"";
 lastGp.textContent=data.race.name.toUpperCase();
 lastUpdated.textContent="Ultimo aggiornamento: "+(data.lastUpdated||"—");
 const sorted=[...data.race.results].sort((a,b)=>a[0]-b[0]);
 if(!sorted.length){resultsGrid.innerHTML=`<div class="empty" style="grid-column:1/-1;padding:30px;text-align:center;color:var(--muted)">Nessun risultato inserito.</div>`;return}
 const mid=Math.ceil(sorted.length/2), chunks=[sorted.slice(0,mid),sorted.slice(mid)];
 resultsGrid.innerHTML=chunks.map(chunk=>`<table><thead><tr><th>Pos</th><th>Pilota</th><th>Scuderia</th><th>Distacco</th><th style="text-align:right">Punti</th></tr></thead><tbody>${chunk.map(r=>`<tr><td class="pos">${r[0]}</td><td><b>${r[1]}</b></td><td>${logo(r[2])}${r[2]}</td><td>${r[3]}</td><td class="points">${r[4]}</td></tr>`).join("")}</tbody></table>`).join("");
}
function openEditor(){buildEditors();modal.classList.add("open")}
function closeEditor(){modal.classList.remove("open")}
function showTab(n,b){document.querySelectorAll(".edit-panel").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.getElementById("edit-"+n).classList.add("active");b.classList.add("active")}
function teamOptions(s){return Object.keys(teams).map(t=>`<option ${t===s?"selected":""}>${t}</option>`).join("")}
function buildEditors(){
 driversEdit.innerHTML=`<thead><tr><th>Pilota</th><th>Scuderia</th><th>Punti</th></tr></thead><tbody>`+data.drivers.map((d,i)=>`<tr><td><input data-d="${i}" data-k="0" value="${d[0]}"></td><td><select data-d="${i}" data-k="1">${teamOptions(d[1])}</select></td><td><input type="number" min="0" data-d="${i}" data-k="2" value="${d[2]}"></td></tr>`).join("")+"</tbody>";
 calendarEdit.innerHTML=`<thead><tr><th>Round</th><th>GP</th><th>Stato</th></tr></thead><tbody>`+data.calendar.map((c,i)=>`<tr><td><input type="number" data-c="${i}" data-k="0" value="${c[0]}"></td><td><input data-c="${i}" data-k="1" value="${c[1]}"></td><td><select data-c="${i}" data-k="2">${["In attesa","Prossima","Disputata"].map(s=>`<option ${s===c[2]?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")+"</tbody>";
 raceName.value=data.race.name;buildRaceEditor()
}
function buildRaceEditor(){
 raceEdit.innerHTML=`<thead><tr><th>Pos</th><th>Pilota</th><th>Scuderia</th><th>Distacco</th><th>Punti</th><th></th></tr></thead><tbody>`+
 data.race.results.map((r,i)=>`<tr><td><input type="number" data-r="${i}" data-k="0" value="${r[0]}"></td><td><input data-r="${i}" data-k="1" value="${r[1]}"></td><td><select data-r="${i}" data-k="2">${teamOptions(r[2])}</select></td><td><input data-r="${i}" data-k="3" value="${r[3]}"></td><td><input type="number" data-r="${i}" data-k="4" value="${r[4]}"></td><td><button class="minor" onclick="removeResult(${i})">X</button></td></tr>`).join("")+"</tbody>";
}
function addResult(){data.race.results.push([data.race.results.length+1,"","Mercedes","",0]);buildRaceEditor()}
function removeResult(i){data.race.results.splice(i,1);buildRaceEditor()}
function saveAll(){
 document.querySelectorAll("[data-d]").forEach(el=>data.drivers[el.dataset.d][el.dataset.k]=el.dataset.k==="2"?Number(el.value)||0:el.value);
 document.querySelectorAll("[data-c]").forEach(el=>data.calendar[el.dataset.c][el.dataset.k]=el.dataset.k==="0"?Number(el.value)||0:el.value);
 document.querySelectorAll("[data-r]").forEach(el=>data.race.results[el.dataset.r][el.dataset.k]=["0","4"].includes(el.dataset.k)?Number(el.value)||0:el.value);
 data.race.name=raceName.value||"Nessuna gara";
 data.lastUpdated=new Date().toLocaleString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
 localStorage.setItem("nozzoLeague2026",JSON.stringify(data));render();closeEditor()
}

function exportHtml(){
  // Ensure latest editor values are saved before export
  saveAll();

  let source = document.documentElement.outerHTML;

  // Embed current data as the new default state
  const serialized = JSON.stringify(data);
  source = source.replace(
    /let data=JSON\.parse\(localStorage\.getItem\("nozzoLeague2026"\)\|\|JSON\.stringify\(base\)\);/,
    `let data=JSON.parse(localStorage.getItem("nozzoLeague2026")||${JSON.stringify(serialized)});`
  );

  // Also replace the base object with the current data, so a new browser sees the same standings
  const baseStart = source.indexOf("const base=");
  const dataStart = source.indexOf('let data=JSON.parse', baseStart);
  if(baseStart !== -1 && dataStart !== -1){
    source = source.slice(0, baseStart) +
      "const base=" + serialized + ";\n" +
      source.slice(dataStart);
  }

  const blob = new Blob(["<!doctype html>\n"+source], {type:"text/html;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "index.html";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function exportBackup(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="NozzoLeague_backup.json";a.click()}
function importBackup(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);localStorage.setItem("nozzoLeague2026",JSON.stringify(data));render();closeEditor()}catch{alert("Backup non valido")}};r.readAsText(f)}
render();
</script>
</body>
</html>
